# every container keeps at most 5 x 10 MB of logs: `docker compose logs` stays quick and the disk stays free
x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '5'

services:
    app:
        build: .
        image: kibbl:latest
        container_name: kibbl-app
        restart: always
        env_file: .env
        environment:
            - TZ=Europe/Berlin
            - PORT=8790
            - MONGODB_URI=mongodb://mongo:27017/kibbl
            - IMAGE_DATA_PATH=/data/images
            - FIRMWARE_DATA_PATH=/data/firmware
            # coloured columns in `docker compose logs`; LOG_LEVEL in .env (info by default)
            - LOG_COLOR=always
        logging: *logging
        ports:
            - '8790:8790'
        volumes:
            - './data/app:/data'
        depends_on:
            - mongo
    # temporary public address until a named tunnel exists: a random https://*.trycloudflare.com
    # that changes on every start of this container. Not started by deploy.sh, so a deploy keeps
    # the address: docker compose --profile tunnel up -d tunnel, url in docker compose logs tunnel
    tunnel:
        image: cloudflare/cloudflared:latest
        container_name: kibbl-tunnel
        profiles: ['tunnel']
        restart: unless-stopped
        command: tunnel --no-autoupdate --url http://app:8790
        logging: *logging
        depends_on:
            - app
    mongo:
        image: mongo:7
        container_name: kibbl-mongo
        restart: always
        # mongod's json log lines in the columns of the app's log (deploy/mongo/log.jq)
        entrypoint: ['bash', '/kibbl-mongo/entrypoint.sh']
        # without the per-connection lines and the storage checkpoint line every minute:
        # what is left are startups, warnings and errors
        command: ['mongod', '--quiet', '--wiredTigerEngineConfigString=verbose=[checkpoint_progress:0]']
        logging: *logging
        environment:
            - TZ=Europe/Berlin
        # only the app reaches the database, no port leaves the host
        volumes:
            - './data/mongo:/data/db'
            - './deploy/mongo:/kibbl-mongo:ro'
