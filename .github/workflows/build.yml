name: build

on:
    push:
    pull_request:

jobs:
    firmware:
        runs-on: ubuntu-latest
        # the ESP-IDF version ESW0009 is built with
        container: espressif/idf:v5.1.6
        strategy:
            matrix:
                include:
                    # kibbl. cam (ESP32-CAM) and kibbl. air (Conny, ESP32-C3) on the shared kibbl_core
                    - project: cam
                      target: esp32
                      prefix: KIBBL
                      image: KIBBL-FW
                    - project: air
                      target: esp32c3
                      prefix: KIBBL-AIR
                      image: KIBBL-AIR
        steps:
            - uses: actions/checkout@v4
            - name: Build
              shell: bash
              working-directory: firmware/${{ matrix.project }}
              run: |
                  . $IDF_PATH/export.sh
                  branch=""
                  if [ "$GITHUB_REF_NAME" != "main" ]; then
                      branch="-${GITHUB_REF_NAME//\//-}"
                  fi
                  p="${{ matrix.prefix }}"
                  ../create_build_info.sh "${GITHUB_SHA::8}" "$branch" "$p"
                  v="$(tr -d '[:space:]' < VERSION)"
                  idf.py set-target ${{ matrix.target }}
                  idf.py build
                  mkdir -p artifacts
                  cp build/${{ matrix.image }}.bin "artifacts/$p-$v-${GITHUB_SHA::8}$branch.bin"
                  # decodes crash addresses the device prints
                  cp build/${{ matrix.image }}.elf "artifacts/$p-$v-${GITHUB_SHA::8}$branch.elf"
                  cp build/bootloader/bootloader.bin "artifacts/$p-bootloader.bin"
                  cp build/partition_table/partition-table.bin "artifacts/$p-partition-table.bin"
                  cp build/ota_data_initial.bin "artifacts/$p-ota-data-initial.bin"
            - uses: actions/upload-artifact@v4
              with:
                  name: firmware-${{ matrix.project }}-${{ github.sha }}
                  path: firmware/${{ matrix.project }}/artifacts

    # kibbl. light (Magic Home controller, ESP8285): an Arduino sketch, ESP-IDF 5 has no ESP8266
    firmware-light:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: arduino/setup-arduino-cli@v2
            - name: Build
              shell: bash
              working-directory: firmware/light
              run: |
                  branch=""
                  if [ "$GITHUB_REF_NAME" != "main" ]; then
                      branch="-${GITHUB_REF_NAME//\//-}"
                  fi
                  ../create_build_info.sh "${GITHUB_SHA::8}" "$branch" KIBBL-LIGHT
                  ./build.sh
                  v="$(tr -d '[:space:]' < VERSION)"
                  mkdir -p artifacts
                  cp build/main.ino.bin "artifacts/KIBBL-LIGHT-$v-${GITHUB_SHA::8}$branch.bin"
                  cp build/main.ino.elf "artifacts/KIBBL-LIGHT-$v-${GITHUB_SHA::8}$branch.elf"
            - uses: actions/upload-artifact@v4
              with:
                  name: firmware-light-${{ github.sha }}
                  path: firmware/light/artifacts

    app:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm test
            - run: docker build -t kibbl:ci .
