# every container keeps at most 5 x 10 MB of logs: `docker compose logs` stays quick and the disk stays free
x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '5'

services:
    app:
        build: .
        image: kibbl:latest
        container_name: kibbl-app
        restart: always
        env_file: .env
        environment:
            - TZ=Europe/Berlin
            - PORT=8790
            # the app's own user, read and write on kibbl only; MONGO_* in .env
            - MONGODB_URI=mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/kibbl?authSource=kibbl
            - IMAGE_DATA_PATH=/data/images
            - FIRMWARE_DATA_PATH=/data/firmware
            # coloured columns in `docker compose logs`; LOG_LEVEL in .env (info by default)
            - LOG_COLOR=always
        logging: *logging
        ports:
            - '8790:8790'
        volumes:
            - './data/app:/data'
        depends_on:
            - mongo
        # the EMONI LoRaWAN server's network: meters are read from it (METER_SOURCE_URL)
        networks:
            - default
            - meters
    # temporary public address until a named tunnel exists: a random https://*.trycloudflare.com
    # that changes on every start of this container. Not started by deploy.sh, so a deploy keeps
    # the address: docker compose --profile tunnel up -d tunnel, url in docker compose logs tunnel
    tunnel:
        image: cloudflare/cloudflared:2026.10.4
        container_name: kibbl-tunnel
        profiles: ['tunnel']
        restart: unless-stopped
        command: tunnel --no-autoupdate --url http://app:8790
        logging: *logging
        depends_on:
            - app
    # cloudflared pinned to 2026.10.2 or later: older ones trust the compromised eMudhra (emSign)
    # intermediates (Cloudflare, 2026-10-20); bump the tag on both services, pull, then up -d
    # the public https address of kibbl. on its own domain: a Cloudflare named tunnel, its public
    # hostnames (https://kibbl.uk -> http://app:8790) set in the Cloudflare dashboard. Not started
    # by deploy.sh; CLOUDFLARE_TUNNEL_TOKEN in .env:
    # docker compose --profile cloudflare up -d cloudflare
    cloudflare:
        image: cloudflare/cloudflared:2026.10.4
        container_name: kibbl-cloudflare
        profiles: ['cloudflare']
        restart: unless-stopped
        command: tunnel --no-autoupdate run
        environment:
            - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
        logging: *logging
        depends_on:
            - app
    # the fixed public https address of kibbl.: its own device on the tailnet,
    # https://kibbl.<tailnet>.ts.net, with Tailscale Funnel on 443 (deploy/tailscale/serve.json):
    # the app, the devices' socket, the MCP endpoint and its OAuth. Not started by deploy.sh; the
    # first start needs an auth key, after that the login is kept in data/tailscale:
    # TS_AUTHKEY=tskey-... docker compose --profile connector up -d connector
    connector:
        image: tailscale/tailscale:latest
        container_name: kibbl-connector
        hostname: kibbl
        profiles: ['connector']
        restart: unless-stopped
        environment:
            - TS_AUTHKEY=${TS_AUTHKEY:-}
            - TS_HOSTNAME=kibbl
            - TS_STATE_DIR=/var/lib/tailscale
            - TS_SERVE_CONFIG=/config/serve.json
            - TS_USERSPACE=true
        logging: *logging
        volumes:
            - './data/tailscale:/var/lib/tailscale'
            - './deploy/tailscale:/config:ro'
        depends_on:
            - app
    mongo:
        image: mongo:7
        container_name: kibbl-mongo
        restart: always
        # mongod's json log lines in the columns of the app's log (deploy/mongo/log.jq)
        entrypoint: ['bash', '/kibbl-mongo/entrypoint.sh']
        # without the per-connection lines and the storage checkpoint line every minute:
        # what is left are startups, warnings and errors. The cache is capped at 1 GB (by default
        # half the host's memory): the health history fetch must not push the rest of jhubuntu out
        command: ['mongod', '--auth', '--quiet', '--wiredTigerCacheSizeGB=1', '--wiredTigerEngineConfigString=verbose=[checkpoint_progress:0]']
        logging: *logging
        environment:
            - TZ=Europe/Berlin
            # users an empty database gets on its first start: admin (MONGO_ROOT_*) for people,
            # the app's user (MONGO_APP_*) by deploy/mongo/init/app-user.js
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
            - MONGO_APP_USER=${MONGO_APP_USER}
            - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
        # on jhubuntu's loopback only, for MongoDB Compass through an SSH tunnel; never on the network
        ports:
            - '127.0.0.1:27017:27017'
        volumes:
            - './data/mongo:/data/db'
            - './deploy/mongo:/kibbl-mongo:ro'
            - './deploy/mongo/init:/docker-entrypoint-initdb.d:ro'

networks:
    # created by the ttn-chirpstack-webhook project, running on the same host
    meters:
        external: true
        name: ${METER_SOURCE_NETWORK:-ttn-chirpstack-webhook_default}
