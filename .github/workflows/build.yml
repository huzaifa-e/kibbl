name: build

on:
    push:
    pull_request:

jobs:
    firmware:
        runs-on: ubuntu-latest
        # the ESP-IDF version ESW0009 is built with
        container: espressif/idf:v5.1.6
        steps:
            - uses: actions/checkout@v4
            - name: Build
              shell: bash
              working-directory: firmware
              run: |
                  . $IDF_PATH/export.sh
                  branch=""
                  if [ "$GITHUB_REF_NAME" != "main" ]; then
                      branch="-${GITHUB_REF_NAME//\//-}"
                  fi
                  ./create_build_info.sh "${GITHUB_SHA::8}" "$branch"
                  idf.py set-target esp32
                  idf.py build
                  mkdir -p artifacts
                  cp build/HOME-MONITOR-FW.bin "artifacts/HM-${GITHUB_SHA::8}$branch.bin"
                  # decodes crash addresses the device prints
                  cp build/HOME-MONITOR-FW.elf "artifacts/HM-${GITHUB_SHA::8}$branch.elf"
                  cp build/bootloader/bootloader.bin artifacts/HM-bootloader.bin
                  cp build/partition_table/partition-table.bin artifacts/HM-partition-table.bin
                  cp build/ota_data_initial.bin artifacts/HM-ota-data-initial.bin
            - uses: actions/upload-artifact@v4
              with:
                  name: firmware-${{ github.sha }}
                  path: firmware/artifacts

    app:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm test
            - run: docker build -t home-monitor:ci .
