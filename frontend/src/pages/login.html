<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Log in · kibbl.</title>
        <meta name="theme-color" content="#d9622b" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/img/logo.svg" />
    </head>

    <body class="d-flex flex-column title-screen">
        <div aria-hidden="true">
            <span class="leaf" style="left: 6%; animation-duration: 11s; animation-delay: -2s"></span>
            <span class="leaf" style="left: 18%; animation-duration: 14s; animation-delay: -7s; width: 20px"></span>
            <span class="leaf" style="left: 31%; animation-duration: 9s; animation-delay: -4s"></span>
            <span class="leaf" style="left: 47%; animation-duration: 13s; animation-delay: -10s; width: 18px"></span>
            <span class="leaf" style="left: 62%; animation-duration: 10s; animation-delay: -1s"></span>
            <span class="leaf" style="left: 74%; animation-duration: 15s; animation-delay: -6s; width: 22px"></span>
            <span class="leaf" style="left: 86%; animation-duration: 12s; animation-delay: -3s"></span>
            <span class="leaf" style="left: 95%; animation-duration: 9.5s; animation-delay: -8s; width: 16px"></span>
        </div>
        <div class="page page-center position-relative" style="z-index: 1">
            <div class="container container-tight py-4">
                <div class="mb-5">
                    <div class="text-center mb-3"><img src="/img/logo.svg" width="64" height="64" alt="" /></div>
                    <div class="game-title">kibbl.</div>
                    <div class="game-subtitle">pets · people · home</div>
                </div>
                <div class="card card-md">
                    <div class="card-body">
                        <h2 class="h2 text-center mb-4">Player 1</h2>
                        <form id="loginForm" autocomplete="on" novalidate>
                            <div class="mb-3">
                                <label class="form-label" for="email">E-mail</label>
                                <input type="email" class="form-control" id="email" placeholder="you@example.com" autocomplete="username" required />
                            </div>
                            <div class="mb-2">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" class="form-control" id="password" autocomplete="current-password" required />
                            </div>
                            <div id="alertContainer" class="mt-3"></div>
                            <div class="form-footer">
                                <button type="submit" class="btn btn-primary w-100 press-start" id="loginBtn">
                                    <span class="blink">&#9654;</span> PRESS START
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-3"><a href="/forgot" class="small">Forgot password?</a></div>
                        <div class="text-center text-secondary small mt-3 d-none" id="signupLink">New here? <a href="/signup">Create an account</a></div>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="/src/script/login.ts"></script>
    </body>
</html>
